[project]
name = "xlsx-autopsy"
dynamic = ["version"]
description = "Autopsy for huge Excel workbooks: pivots, connections, and formulas into DuckDB without opening the file."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Surety Labs" }]
keywords = ["excel", "xlsx", "pivot", "forensics", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "duckdb>=1.2",
    "fastexcel>=0.12",
    "lxml>=5.0",
    "polars>=1.0,<2",
    "rich>=13.0",
]

[project.scripts]
xlsx-autopsy = "xlsx_autopsy.reconstruct:main"

[project.urls]
Homepage = "https://github.com/suretylabs/xlsx-autopsy"
Repository = "https://github.com/suretylabs/xlsx-autopsy"
Issues = "https://github.com/suretylabs/xlsx-autopsy/issues"
Changelog = "https://github.com/suretylabs/xlsx-autopsy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/xlsx_autopsy/__init__.py"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.400",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = [
    "ignore:from_arrow\\(<ArrowStreamExportable>\\) will return a Series:FutureWarning",
]
